# Updated from SvelteKit docs. See https://kit.svelte.dev/docs/adapter-static#github-pages for more information

name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build_site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Resume PDF is published as a rolling GitHub release by the
      # smores56/resume repo (release-pdf.yml). Download it here so the
      # static build serves it at /samuel-mohr-resume.pdf.
      # Requires the RESUME_RELEASE_TOKEN secret (fine-grained PAT, read-only
      # contents access on smores56/resume) — see README for setup/rotation.
      - name: Download latest resume PDF
        env:
          TOKEN: ${{ secrets.RESUME_RELEASE_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            curl -fsSL -H "Authorization: Bearer $TOKEN" \
              https://github.com/smores56/resume/releases/latest/download/samuel-mohr-resume.pdf \
              -o static/samuel-mohr-resume.pdf
          else
            echo "::error::RESUME_RELEASE_TOKEN secret is not set; resume PDF will be stale/missing"
            exit 1
          fi

      # If you're using pnpm, add this step then change the commands and cache key below to use `pnpm`
      # - name: Install pnpm
      #   uses: pnpm/action-setup@v3
      #   with:
      #     version: 8

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install

      - name: build
        env:
          BASE_PATH: "/${{ github.event.repository.name }}"
        run: |
          yarn run build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          # this should match the `pages` option in your adapter-static options
          path: "build/"

  deploy:
    needs: build_site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
